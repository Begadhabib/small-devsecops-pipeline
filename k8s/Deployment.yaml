apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-app-deployment
  namespace: chess
spec:
  replicas: 4
  selector:
    matchLabels:
      app: chess-app
  template:
    metadata:
      labels:
        app: chess-app
    spec:
      containers:
        - name: chess-app-container
          image: begad1/my_chess_app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi  